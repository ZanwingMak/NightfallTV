name: tvOS regression
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "README.md", "PRIVACY.md", "LICENSE", "site/**", ".github/workflows/pages.yml"]
  pull_request:
    paths-ignore: ["docs/**", "README.md", "PRIVACY.md", "LICENSE", "site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
    inputs:
      test_filter:
        description: Optional XCTest identifier for a targeted regression
        required: false
        default: ''
permissions:
  contents: read
jobs:
  regression:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Choose an Apple TV simulator
        run: |
          TASK_SIM_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "tvOS" in k for x in v if x["isAvailable"]))')
          echo "TASK_SIM_ID=$TASK_SIM_ID" >> "$GITHUB_ENV"
      - name: Build and test
        env:
          TEST_FILTER: ${{ inputs.test_filter }}
        run: |
          TEST_ARGS=()
          if [[ -n "$TEST_FILTER" ]]; then TEST_ARGS+=("-only-testing:$TEST_FILTER" "-only-testing:NightfallTVTests/DownloadTests"); fi
          xcodebuild -project NightfallTV.xcodeproj -scheme NightfallTV \
            -destination "platform=tvOS Simulator,id=$TASK_SIM_ID" \
            -resultBundlePath TestResults.xcresult -collect-test-diagnostics never "${TEST_ARGS[@]}" CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= test
      - name: Save regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tvos-regression
          path: TestResults.xcresult
          retention-days: 7
